<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bruno Castiglia</title>
<style>
  :root{color-scheme:light}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
    background:#f4f6f8;color:#18222f;
    font:16px/1.6 "Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{max-width:520px;padding:32px 24px;text-align:center}
  h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
  p{color:#5b6b7e;margin:0 0 22px;font-size:14px}
  a.projeto{display:inline-flex;align-items:center;gap:10px;text-decoration:none;
    background:#fff;border:1px solid #dfe4ea;border-radius:12px;padding:14px 18px;
    color:#18222f;font-weight:650;box-shadow:0 6px 20px rgba(23,43,77,.10)}
  a.projeto:hover{border-color:#0a7d5c}
  a.projeto span{font-weight:400;color:#5b6b7e;font-size:13px}
  .marca{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;
    background:linear-gradient(140deg,#0a7d5c,#0b7f80);color:#fff;font-weight:800}
</style>
</head>
<body>
<main>
  <h1>Bruno Castiglia</h1>
  <p>Projetos publicados aqui.</p>
  <a class="projeto" href="/moneytogo/">
    <span class="marca" aria-hidden="true">◎</span>
    MoneyToGo <span>— para onde seu dinheiro te leva</span>
  </a>
</main>
</body>
</html>
