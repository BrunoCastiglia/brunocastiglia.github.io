# ==========================================================================
# Tarifas do Aviasales, coletadas na publicação
# --------------------------------------------------------------------------
# A API do Travelpayouts não manda cabeçalho de CORS e o token não pode
# trafegar no navegador. Aqui não há nenhum dos dois problemas: a Action roda
# no servidor do GitHub, o token vem dos segredos do repositório (mascarado
# nos registros), e o resultado é gravado como arquivo estático. O site lê o
# próprio arquivo — mesma origem, instantâneo, e de pé mesmo se a API cair.
#
# Uma vez por dia basta: os preços de lá são cache das últimas 48 h.
# ==========================================================================
name: Tarifas

on:
  schedule:
    - cron: '17 4 * * *'      # 04:17 UTC, madrugada em Lisboa e no Brasil
  workflow_dispatch:           # e sob demanda, pelo botão Run workflow

# Sem isto o passo de commit falha: o token padrão entra somente-leitura.
permissions:
  contents: write

# Duas coletas ao mesmo tempo escreveriam por cima uma da outra.
concurrency:
  group: tarifas
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Passo temporário: mostra o formato real de nearest-places-matrix nos
      # registros, para a coleta ser desenhada em cima do que a API devolve e
      # não em cima de uma suposição. Sai assim que a coleta estiver escrita.
      - name: Sondar a matriz de vizinhos
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS: ${{ secrets.TRAVELPAYOUTS }}
        run: node scripts/sondar-matriz.mjs

      - name: Coletar tarifas
        env:
          # Os dois nomes, porque o segredo pode ter sido criado de qualquer
          # uma das formas. O que não existir chega vazio e é ignorado.
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS: ${{ secrets.TRAVELPAYOUTS }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          MARKER: ${{ vars.MARKER }}
        run: node scripts/coletar-tarifas.mjs

      - name: Publicar o que mudou
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/data/fares
          # Sem mudança não há commit: um commit vazio por dia só polui o
          # histórico e dispara uma republicação do Pages à toa.
          if git diff --cached --quiet; then
            echo 'Nada mudou nas tarifas.'
            exit 0
          fi
          git commit -m 'Tarifas do dia'
          git push
